  function parsujDate(s){
    var cz = String(s).split('-');
    return new Date(+cz[0], +cz[1] - 1, +cz[2]);
  }

    var d = parsujDate(t.data);

  function dataSlownie(d, jezyk){
    if (jezyk === 'EN') {

    return d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2)

  }

  function porownaj(a, b){

    if(!w) return '';
    var akapity = w.reszta || [];
    /* Pierwszy akapit widoczny od razu w prawej kolumnie — reszta pod „Czytaj więcej”. */
    var widoczny = akapity.length ? '<p>' + esc(akapity[0]) + '</p>' : '';
    var ukryte = akapity.slice(1).map(function(a){ return '<p>' + esc(a) + '</p>'; }).join('');

    var prawa = widoczny
      + (ukryte
          ? '<div class="od-wstep__reszta" id="od-wstep-reszta" hidden>' + ukryte + '</div>'
          + '<button class="od-wstep__toggle" type="button" aria-expanded="false" aria-controls="od-wstep-reszta"'
          + ' data-rozwin="' + esc(w.rozwin) + '" data-zwin="' + esc(w.zwin) + '">' + esc(w.rozwin) + '</button>'
          : '');

    var tresc = prawa
      ? '<div class="od-wstep__grid">'
        + '<div><p class="od-wstep__lead">' + esc(w.lead) + '</p></div>'
        + '<div>' + prawa + '</div>'
        + '</div>'
      : '<p class="od-wstep__lead">' + esc(w.lead) + '</p>';

    return '<div class="od-wstep"><div class="od-wstep__box">' + tresc + '</div></div>';
  }

  function renderNawigacja(karty){
    var linki = karty.filter(function(k){ return aktualneTerminy(k).length; }).map(function(k){
      return '<a class="od-nav__link" href="#' + esc(k.id) + '">' + esc(k.skrot || k.tytul) + '</a>';
    }).join('');
    if(!linki) return '';
    return '<nav class="od-nav" aria-label="Rodzaje dni otwartych">'
         +   '<span class="od-nav__label">' + esc(NAWIGACJA.etykieta) + '</span>' + linki
         + '</nav>';
  }

  function renderMiejsce(m){
    if(!m || !m.nazwa) return '';
    var pin = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>';
    if (m.mapa) {
      return '<a class="od-miejsce" href="' + esc(m.mapa) + '" target="_blank" rel="noopener">' + pin
           + '<span>' + esc(m.nazwa) + '</span>'
           + '<span class="od-sr"> (otwiera mapę w nowej karcie)</span></a>';
    }
    return '<span class="od-miejsce">' + pin + '<span>' + esc(m.nazwa) + '</span></span>';
  }

  function renderTermin(t, k){
    var jezyk = k.jezyk;
    var d = parsujDate(t.data);
    var skrot = (jezyk === 'EN' ? MIESIACE_EN : MIESIACE)[d.getMonth()];
    var dd = ('0' + d.getDate()).slice(-2);
    var slownie = dataSlownie(d, jezyk);

    /* Data w chipie jest wizualnym skrótem — pełny zapis czyta czytnik ekranu. */
    var chip = '<div class="od-chip" aria-hidden="true">'
             + '<b class="od-chip__d">' + dd + '</b>'
             + '<span class="od-chip__m">' + skrot + '</span>'
             + (t.godzina ? '<span class="od-chip__g">' + esc(t.godzina) + '</span>' : '')
             + '</div>';

    var formaty = t.format ? [].concat(t.format) : [];
    var meta = formaty.map(function(f){
      return '<span class="od-tag od-tag--' + esc(f.toLowerCase()) + '">' + esc(f) + '</span>';
    }).join('');

    var etykieta = slownie + (t.godzina ? ', godz. ' + t.godzina : '');
    var czas = '<time datetime="' + esc(isoData(d, t.godzina)) + '">' + esc(slownie)
             + (t.godzina ? ', ' + esc(t.godzina) : '') + '</time>';

    var tytul;
    if (t.tytul) {
      tytul = t.link
        ? '<div class="od-termin__tytul"><a href="' + esc(t.link) + '" target="_blank" rel="noopener">' + esc(t.tytul) + '</a></div>'
          + '<div class="od-dopisek">' + czas + '</div>'
        : '<div class="od-termin__tytul">' + esc(t.tytul) + '</div><div class="od-dopisek">' + czas + '</div>';
    } else {
      tytul = '<div class="od-termin__tytul">' + czas + '</div>';
    }
    var dopisek = t.dopisek ? '<div class="od-dopisek">' + esc(t.dopisek) + '</div>' : '';

    var akcja = '';
    var pole = t.pole || k.pole;
    if (!t.link && !k.zapisy && pole) {
      var kierunek = t.kierunek || k.kierunek || '';
      var etykietaBtn = jezyk === 'EN' ? ZAPISY.przyciskEN : ZAPISY.przycisk;
      akcja = '<button class="od-termin__akcja" type="button" aria-pressed="false"'
            + ' data-pole="' + esc(pole) + '" data-termin="' + esc(pelnaData(d)) + '"'
            + ' data-etykieta="' + esc(etykieta + (t.dopisek ? ' — ' + t.dopisek : '')) + '"'
            + (kierunek ? ' data-kierunek="' + esc(kierunek) + '"' : '') + '>'
            + ptaszek() + '<span>' + esc(etykietaBtn) + '</span>'
            + '<span class="od-sr"> — ' + esc(etykieta) + '</span></button>';
    }

    return '<li class="od-termin">'
         +   chip
         +   '<div class="od-termin__tresc">'
         +     tytul
         +     dopisek
         +     (meta || t.miejsce
                ? '<div class="od-termin__meta">' + meta + renderMiejsce(t.miejsce) + '</div>'
                : '')
         +   '</div>'
         +   akcja
         + '</li>';
  }

  function renderKarta(k){
    var terminy = aktualneTerminy(k);

    var tresc = terminy.length
      ? '<ul class="od-terminy">' + terminy.map(function(t){ return renderTermin(t, k); }).join('') + '</ul>'
      : '<p class="od-karta__pusto">' + esc(BRAK_TERMINOW.tekst)
        + (BRAK_TERMINOW.akcja
            ? ' <a class="od-karta__pusto-link" href="' + esc(BRAK_TERMINOW.akcja.link) + '">'
              + esc(BRAK_TERMINOW.akcja.tekst) + '</a>'
            : '')
        + '</p>';

    /* CTA zostaje także przy pustej liście — nigdy nie zostawiamy ślepego zaułka. */
    var cta = '';
    if (k.zapisy) {
      var zewn = /^https?:/i.test(k.zapisy.link);
      cta = '<a class="od-karta__cta" href="' + esc(k.zapisy.link) + '"'
          + (zewn ? ' target="_blank" rel="noopener"' : '') + '>'
          + '<span>' + esc(k.zapisy.tekst) + '</span>'
          + (zewn ? '<span class="od-sr"> (otwiera się w nowej karcie)</span>' : '')
          + strzalka('od-arrow--cta' + (zewn ? ' od-arrow--ext' : '')) + '</a>';
    }

    return '<section class="od-karta' + (k.motyw ? ' od-motyw-' + esc(k.motyw) : '') + '"'
         +   ' id="' + esc(k.id) + '" aria-labelledby="' + esc(k.id) + '-tytul"'
         +   (k.jezyk === 'EN' ? ' lang="en"' : '') + '>'
         +   '<div class="od-karta__head">'
         +     (k.podtytul ? '<span>' + esc(k.podtytul) + '</span>' : '')
         +     '<h2 id="' + esc(k.id) + '-tytul">' + esc(k.tytul) + '</h2>'
         +   '</div>'
         +   tresc
         +   '<div class="od-karta__spacer"></div>'
         +   cta
         + '</section>';
  }

  function renderFormularz(f){
    return '<section class="od-formularz" id="' + esc(f.kontener) + '" aria-labelledby="od-formularz-tytul">'
         +   '<div class="od-formularz__box">'
         +     '<h2 id="od-formularz-tytul">' + esc(f.naglowek) + '</h2>'
         +     '<p>' + esc(f.opis) + '</p>'
         +     '<div class="od-status" id="od-status" role="status" aria-live="polite" hidden></div>'
         +     '<div id="od-formularz-ramka"></div>'
         +   '</div>'
         + '</section>';
  }

  function renderInfo(info){
    if(!info) return '';
    var punkty = info.punkty.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('');
    var media = info.zdjecie
      ? '<div class="open-days-info__media"><img src="' + esc(info.zdjecie) + '" alt="' + esc(info.zdjecieAlt || '')
        + '" loading="lazy" decoding="async" width="1200" height="800" onerror="this.style.display=\'none\'"></div>'
      : '';
    return '<section class="open-days-info" aria-label="Co Cię czeka podczas dnia otwartego">'
         +   '<div class="open-days-info__text">'
         +     '<h2>' + esc(info.naglowek) + '</h2>'
         +     '<ul>' + punkty + '</ul>'
         +     (info.stopka ? '<p class="open-days-info__foot">' + esc(info.stopka) + '</p>' : '')
         +     (info.kontakt ? '<p class="open-days-info__foot">' + esc(info.kontakt.tekst)
              + ' <a href="mailto:' + esc(info.kontakt.mail) + '">' + esc(info.kontakt.mail) + '</a></p>' : '')
         +   '</div>'
         +   media
         + '</section>';
  }

  function renderGaleria(g){
    if(!g || !g.zdjecia || !g.zdjecia.length) return '';
    var kolor = function(i){ return 'hsl(' + ((i*43)%360) + ',42%,80%)'; };
    var slides = g.zdjecia.map(function(z,i){
      var img = z.src
        ? '<img src="' + esc(z.src) + '" alt="' + esc(z.alt || '') + '" loading="lazy" decoding="async"'
          + ' onerror="this.style.display=\'none\'">'
        : '';
      return '<div class="odg-slide" role="group" aria-roledescription="slajd" aria-label="' + (i+1) + ' z ' + g.zdjecia.length + '"'
           + ' style="background:' + kolor(i) + '"><span class="odg-ph" aria-hidden="true">Zdjęcie ' + (i+1) + '</span>' + img + '</div>';
    }).join('');
    var thumbs = g.zdjecia.map(function(z,i){
      var img = z.src ? '<img src="' + esc(z.src) + '" alt="" loading="lazy" decoding="async" onerror="this.style.display=\'none\'">' : '';
      return '<button class="odg-thumb" type="button" aria-label="Pokaż zdjęcie ' + (i+1) + ': ' + esc(z.alt || '') + '">'
           + '<span class="odg-ph" aria-hidden="true">' + (i+1) + '</span>' + img + '</button>';
    }).join('');
    var pauza = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg>';
    return '<section class="odg-gallery" aria-labelledby="od-galeria-tytul">'
         +   (g.naglowek ? '<h2 id="od-galeria-tytul">' + esc(g.naglowek) + '</h2>' : '')
         +   '<div class="odg-stage" role="region" aria-roledescription="karuzela" aria-label="Zdjęcia z dni otwartych" tabindex="0">'
         +     '<button class="odg-arrow odg-prev" type="button" aria-label="Poprzednie zdjęcie">' + strzalka('od-arrow--gal') + '</button>'
         +     '<div class="odg-track">' + slides + '</div>'
         +     '<button class="odg-arrow odg-next" type="button" aria-label="Następne zdjęcie">' + strzalka('od-arrow--gal') + '</button>'
         +     '<div class="odg-bar">'
         +       '<button class="odg-play" type="button" aria-label="Zatrzymaj pokaz slajdów">' + pauza + '</button>'
         +       '<div class="odg-counter" aria-live="polite"><span class="odg-cur">1</span> / <span class="odg-total">' + g.zdjecia.length + '</span></div>'
         +     '</div>'
         +   '</div>'
         +   '<div class="odg-thumbs">' + thumbs + '</div>'
         + '</section>';
  }


  /* ------------------------------------------------------------------ *
   *  ZACHOWANIA
   * ------------------------------------------------------------------ */

  function initWstep(root){
    var btn = root.querySelector('.od-wstep__toggle');
    if(!btn) return;
    var box = root.querySelector('#od-wstep-reszta');
    btn.addEventListener('click', function(){
      var otwarte = box.hasAttribute('hidden');
      if (otwarte) { box.removeAttribute('hidden'); } else { box.setAttribute('hidden',''); }
      btn.setAttribute('aria-expanded', otwarte ? 'true' : 'false');
      btn.textContent = otwarte ? btn.getAttribute('data-zwin') : btn.getAttribute('data-rozwin');
    });
  }

  function initFormularz(){
    if (document.getElementById(FORMULARZ.id)) { return; }
    var box = document.getElementById('od-formularz-ramka');
    if (!box) { return; }

    var ramka = document.createElement('iframe');
    ramka.id = FORMULARZ.id;
    ramka.title = FORMULARZ.tytul;
    ramka.src = FORMULARZ.adres;
    ramka.setAttribute('allowtransparency', 'true');
    ramka.setAttribute('allow', 'geolocation; microphone; camera; fullscreen; payment');
    ramka.setAttribute('frameborder', '0');
    ramka.setAttribute('scrolling', 'no');
    ramka.style.cssText = 'min-width:100%;max-width:100%;height:' + FORMULARZ.wysokosc + ';border:none;display:block;';
    box.appendChild(ramka);

    initWysokoscRamki(ramka);

    var handler = document.createElement('script');
    handler.src = FORMULARZ.baza + 's/umd/latest/for-form-embed-handler.js';
    handler.onload = function () {
      if (window.jotformEmbedHandler) {
        window.jotformEmbedHandler("iframe[id='" + FORMULARZ.id + "']", FORMULARZ.baza);
      }
    };
    document.body.appendChild(handler);
  }

  /* Formularz sam raportuje swoją wysokość przez postMessage. Słuchamy tego niezależnie
     od skryptu JotForm — dzięki temu ramka rośnie i maleje razem z treścią, także po
     wysłaniu zgłoszenia i na stronie z podziękowaniem. */
  function initWysokoscRamki(ramka){
    var dostalismyWysokosc = false;

    function zaufaneZrodlo(origin){
      var a = document.createElement('a');
      a.href = origin;
      var host = a.hostname || '';
      return host === 'jotform.com' || host.slice(-12) === '.jotform.com';
    }

    function ustaw(h){
      h = parseInt(h, 10);
      if (!h || isNaN(h)) return;
      h = Math.max(h, FORMULARZ.wysokoscMin);
      dostalismyWysokosc = true;
      if (parseInt(ramka.style.height, 10) !== h) { ramka.style.height = h + 'px'; }
    }

    window.addEventListener('message', function(e){
      if (!zaufaneZrodlo(e.origin)) return;
      var d = e.data;
      if (typeof d === 'string') {
        /* Format klasyczny: "setHeight:812:262042735826963" */
        var cz = d.split(':');
        if (cz[0] === 'setHeight') { ustaw(cz[1]); }
        else if (d.indexOf('{') === 0) {
          try { d = JSON.parse(d); } catch (err) { return; }
        }
      }
      if (d && typeof d === 'object') {
        var typ = d.type || d.action || d.name;
        if (typ === 'setHeight' || typ === 'resize') { ustaw(d.height || d.value || d.data); }
      }
    }, false);

    /* Gdyby formularz nigdy nie przysłał wysokości (przekierowanie na inną domenę,
       zablokowany skrypt) — dajemy więcej miejsca i włączamy przewijanie w ramce,
       żeby treść nie została ucięta. */
    setTimeout(function(){
      if (!dostalismyWysokosc) {
        ramka.style.height = FORMULARZ.wysokoscAwaryjna;
        ramka.setAttribute('scrolling', 'auto');
      }
    }, FORMULARZ.czasOczekiwania);
  }

  function initZapisy(root){
    var bazowy = '';
    var terminy = {};
    var kierunki = [];

    function znajdzRamke(){
      var r = document.getElementById(FORMULARZ.id);
      if (r && !bazowy) { bazowy = r.getAttribute('src').split('?')[0]; }
      return r;
    }

    function adres(){
      var parametry = [];
      for (var pole in terminy) {
        if (Object.prototype.hasOwnProperty.call(terminy, pole)) {
          parametry.push(encodeURIComponent(pole) + '=' + encodeURIComponent(terminy[pole].wartosc));
        }
      }
      if (kierunki.length && ZAPISY.poleKierunek) {
        parametry.push(encodeURIComponent(ZAPISY.poleKierunek) + '=' + kierunki.map(encodeURIComponent).join(','));
      }
      return parametry.length ? bazowy + '?' + parametry.join('&') : bazowy;
    }

    function odswiezStatus(){
      var el = document.getElementById('od-status');
      if (!el) return;
      var lista = [];
      for (var p in terminy) {
        if (Object.prototype.hasOwnProperty.call(terminy, p)) { lista.push(terminy[p].etykieta); }
      }
      if (!lista.length) { el.hidden = true; el.innerHTML = ''; return; }
      el.innerHTML = '<strong>' + esc(ZAPISY.statusPrefiks) + '</strong>'
                   + lista.map(esc).join('<br>')
                   + '<br><span>' + esc(ZAPISY.statusPodpowiedz) + '</span>';
      el.hidden = false;
    }

    root.addEventListener('click', function(e){
      var cel = e.target.closest ? e.target : null;

      /* Kafelek/linki wewnętrzne — płynne przewijanie z poszanowaniem reduced-motion. */
      var przewijacz = cel && cel.closest ? cel.closest('[data-przewin]') : null;
      if (przewijacz) {
        e.preventDefault();
        var docel = document.getElementById(przewijacz.getAttribute('data-przewin'));
        if (docel) { history.replaceState(null, '', '#' + docel.id); przewin(docel); }
        return;
      }

      var btn = cel && cel.closest ? cel.closest('[data-termin]') : null;
      if (!btn) return;

      var pole = btn.getAttribute('data-pole');
      var kierunek = btn.getAttribute('data-kierunek');

      /* Ponowne kliknięcie tego samego terminu = odznaczenie. */
      if (terminy[pole] && terminy[pole].btn === btn) {
        btn.classList.remove('is-wybrany');
        btn.setAttribute('aria-pressed', 'false');
        delete terminy[pole];
      } else {
        if (terminy[pole]) {
          terminy[pole].btn.classList.remove('is-wybrany');
          terminy[pole].btn.setAttribute('aria-pressed', 'false');
        }
        terminy[pole] = {
          wartosc: btn.getAttribute('data-termin'),
          etykieta: btn.getAttribute('data-etykieta'),
          btn: btn
        };
        btn.classList.add('is-wybrany');
        btn.setAttribute('aria-pressed', 'true');
        if (kierunek && kierunki.indexOf(kierunek) === -1) { kierunki.push(kierunek); }
      }

      var ramka = znajdzRamke();
      if (ramka) {
        var nowy = adres();
        if (ramka.getAttribute('src') !== nowy) { ramka.setAttribute('src', nowy); }
      }

      odswiezStatus();
      przewin(document.getElementById(FORMULARZ.kontener));
    });
  }

  function initGaleria(root){
    var g = root.querySelector('.odg-gallery');
    if(!g) return;
    var track  = g.querySelector('.odg-track');
    var slides = g.querySelectorAll('.odg-slide');
    var thumbs = g.querySelectorAll('.odg-thumb');
    var cur    = g.querySelector('.odg-cur');
    var play   = g.querySelector('.odg-play');
    var stage  = g.querySelector('.odg-stage');
    var total  = slides.length;
    var idx = 0, timer = null, wlaczone = GALERIA.autoplay && !BEZ_RUCHU;

    var ikonaPauzy = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg>';
    var ikonaPlay  = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><polygon points="7 4 20 12 7 20"></polygon></svg>';

    function go(n){
      idx = (n + total) % total;
      track.style.transform = 'translateX(-' + (idx*100) + '%)';
      if(cur) cur.textContent = (idx+1);
      for(var i=0;i<total;i++){
        slides[i].setAttribute('aria-hidden', i === idx ? 'false' : 'true');
        thumbs[i].classList.toggle('is-active', i===idx);
        thumbs[i].setAttribute('aria-current', i===idx ? 'true' : 'false');
      }
    }
    function next(){ go(idx+1); }
    function prev(){ go(idx-1); }
    function start(){ if(wlaczone && total>1 && !timer){ timer = setInterval(next, GALERIA.interval || 5000); } }
    function stop(){ if(timer){ clearInterval(timer); timer=null; } }
    function restart(){ stop(); start(); }

    function odswiezPrzycisk(){
      play.innerHTML = wlaczone ? ikonaPauzy : ikonaPlay;
      play.setAttribute('aria-label', wlaczone ? 'Zatrzymaj pokaz slajdów' : 'Wznów pokaz slajdów');
    }

    play.addEventListener('click', function(){
      wlaczone = !wlaczone;
      odswiezPrzycisk();
      if (wlaczone) { start(); } else { stop(); }
    });

    g.querySelector('.odg-next').addEventListener('click', function(){ next(); restart(); });
    g.querySelector('.odg-prev').addEventListener('click', function(){ prev(); restart(); });
    for(var i=0;i<thumbs.length;i++){ (function(i){ thumbs[i].addEventListener('click', function(){ go(i); restart(); }); })(i); }

    /* Klawiatura: strzałki przewijają karuzelę. */
    stage.addEventListener('keydown', function(e){
      if (e.key === 'ArrowRight') { e.preventDefault(); next(); restart(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); restart(); }
    });

    var x0 = null;
    stage.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
    stage.addEventListener('touchend', function(e){
      if(x0===null) return;
      var dx = e.changedTouches[0].clientX - x0;
      if(Math.abs(dx) > 40){ (dx < 0 ? next : prev)(); restart(); }
      x0 = null;
    });

    g.addEventListener('mouseenter', stop);
    g.addEventListener('mouseleave', start);
    g.addEventListener('focusin', stop);
    g.addEventListener('focusout', function(e){
      if (!g.contains(e.relatedTarget)) { start(); }
    });

    odswiezPrzycisk();
    go(0);
    start();
  }


  /* ------------------------------------------------------------------ *
   *  MONTAŻ
   * ------------------------------------------------------------------ */

  var html = renderNaglowek(NAGLOWEK)
           + renderWstep(WSTEP)
           + renderNawigacja(KARTY)
           + '<div class="od-siatka">' + KARTY.map(renderKarta).join('') + '</div>'
           + renderFormularz(FORMULARZ)
           + renderInfo(INFO)
           + renderGaleria(GALERIA);

  var mount = document.getElementById('dni-otwarte-daty');
  if (!mount) {
    var cs = document.currentScript;
    mount = document.createElement('div');
    mount.id = 'dni-otwarte-daty';
    if (cs && cs.parentNode) { cs.parentNode.insertBefore(mount, cs); }
    else { document.body.appendChild(mount); }
  }
  mount.innerHTML = html;

  initFormularz();
  initWstep(mount);
  initZapisy(mount);
  initGaleria(mount);

})();
</script>

</body>
